<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
<title id="title">Vortex Labs X mark</title>
<desc id="desc">A sculptural crossed glass-metal mark with silver upper surfaces and deep red illuminated lower surfaces, inspired by the supplied Vortex Labs artwork.</desc>
<defs>
 <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090b10"/><stop offset=".25" stop-color="#9ca2a5"/><stop offset=".48" stop-color="#252832"/><stop offset=".7" stop-color="#6d0619"/><stop offset="1" stop-color="#f20c36"/></linearGradient>
 <linearGradient id="right" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6d7d1"/><stop offset=".24" stop-color="#4e5355"/><stop offset=".48" stop-color="#141820"/><stop offset=".72" stop-color="#97001e"/><stop offset="1" stop-color="#f20c36"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb8a9"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#a5b8d2"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="640" height="760" fill="#030406"/>
<path d="M92 0H190L548 760H430Z" fill="url(#left)" stroke="#252a35" stroke-width="5"/>
<path d="M450 0H548L190 760H72Z" fill="url(#right)" stroke="#252a35" stroke-width="5"/>
<path d="M92 0H190L548 760" fill="none" stroke="url(#edge)" stroke-width="5" opacity=".9"/>
<path d="M450 0H548L190 760" fill="none" stroke="url(#edge)" stroke-width="5" opacity=".8"/>
<path d="M102 0L454 760M538 0L184 760" fill="none" stroke="#ff173f" stroke-width="12" opacity=".18" filter="url(#glow)"/>
<path d="M102 0L454 760M538 0L184 760" fill="none" stroke="#ff8b92" stroke-width="2" opacity=".8"/>
<path d="M190 0L548 760M450 0L92 760" fill="none" stroke="#d8e2f0" stroke-width="1.4" opacity=".65"/>
</svg>